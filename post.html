<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="">
  <title>My Blog</title>
  <script>
    // 저장된 테마를 CSS 적용 전에 반영해 화면 깜빡임을 막는다.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/post.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="./">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="테마 전환"></button>
    </div>
  </header>

  <main id="main" class="container">
    <nav class="back-nav" aria-label="이동">
      <a class="back-link" href="./">← 목록으로</a>
    </nav>

    <article id="post" aria-live="polite">
      <p class="status">글을 불러오는 중…</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">© My Blog · 마크다운으로 작성했습니다</div>
  </footer>
</body>
</html>
